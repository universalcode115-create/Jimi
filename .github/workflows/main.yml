name: V10 Intent Model

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-v10:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tensorflow numpy

      - name: Check V10 files
        run: |
          test -f app/src/v10_intent_model.tflite
          test -f app/src/v10_vocabulary.json
          test -f app/src/v10_labels.json
          test -f app/src/v10_config.json
          echo "All V10 files found successfully."

      - name: Test TFLite model
        run: |
          python - <<'PY'
          import tensorflow as tf
          import json

          model_path = "app/src/v10_intent_model.tflite"
          vocab_path = "app/src/v10_vocabulary.json"
          labels_path = "app/src/v10_labels.json"
          config_path = "app/src/v10_config.json"

          print("Loading V10 model...")

          interpreter = tf.lite.Interpreter(model_path=model_path)
          interpreter.allocate_tensors()

          inputs = interpreter.get_input_details()
          outputs = interpreter.get_output_details()

          print("Input:", inputs)
          print("Output:", outputs)

          with open(vocab_path, "r", encoding="utf-8") as f:
              vocabulary = json.load(f)

          with open(labels_path, "r", encoding="utf-8") as f:
              labels = json.load(f)

          with open(config_path, "r", encoding="utf-8") as f:
              config = json.load(f)

          print("Vocabulary loaded:", len(vocabulary))
          print("Labels loaded:", labels)
          print("Config loaded successfully.")

          assert len(inputs) == 1, "Unexpected number of inputs"
          assert len(outputs) == 1, "Unexpected number of outputs"

          print("V10 TFLite validation PASSED!")
          PY
