name: V10 Android APK Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check V10 files
        run: |
          test -f app/src/v10_intent_model.tflite
          test -f app/src/v10_vocabulary.json
          test -f app/src/v10_labels.json
          test -f app/src/v10_config.json
          echo "All V10 files found successfully."

      - name: Show project structure
        run: |
          echo "Project files:"
          find . -maxdepth 4 -type f | sort

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jimi-V10-debug-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
